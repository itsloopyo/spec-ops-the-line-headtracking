;  Spec Ops: The Line - Head Tracking configuration
;  Lives next to dinput8.dll in Binaries/Win32/.

[General]
EnableOnStartup=1
Port=4242
DataFreshnessMs=500
;  Yaw mode: true = horizon-locked yaw (default), false = camera-local.
WorldSpaceYaw=1
;  Draw the mod's own marker at the aim point as well. The game's own
;  crosshair is already moved there, so this is a diagnostic.
ShowAimMarker=0

[FieldOfView]
;  Multiplies the field of view the game renders with. 1.0 leaves it alone;
;  the game draws 72 degrees horizontally from the hip, so 1.25 gives 90.
;  Range 0.5 - 2.0. Only the picture widens: the game keeps its own value
;  for everything it decides with, so shots land exactly where they did.
;  Aiming down sights is scaled by the same factor, so the sights keep
;  their relative zoom.
Scale=1

[Smoothing]
;  Smoothing 0.0 (responsive) - 1.0 (heavy). Covers rotation and position.
;  The value is picked per connection from the packet source address:
;  LocalSmoothing for a tracker running on this PC (loopback),
;  RemoteSmoothing for a phone or other device on the network.
LocalSmoothing=0
RemoteSmoothing=0.15

[Position]
;  6DOF positional tracking. The pose is used at 1:1 - shape it in your tracker,
;  not here. PositionScale = world units (cm) per metre of head translation.
Enabled=1
LimitX=0.3
;  Vertical travel is clamped to [-LimitYDown, +LimitY]: how far the view
;  may rise and how far it may drop, as separate metre budgets.
LimitY=0.2
LimitYDown=0.2
LimitZ=0.4
LimitZBack=0.1
PositionScale=100

[Collision]
;  Stop a lean at the level's geometry instead of pushing the view through
;  a wall. The game collides its own camera before head tracking is added,
;  so without this a lean towards cover puts the camera inside it.
Enabled=1
;  How far short of a surface the leaned view stops, in world units (cm).
Padding=10

[Hotkeys]
;  Virtual-key codes. Defaults: End (toggle), Page Up (cycle tracking mode), Page Down (yaw mode).
Toggle=0x23
CycleMode=0x21
YawMode=0x22
;  Chord alternatives: Ctrl+Shift+Y (toggle), Ctrl+Shift+G (cycle tracking mode), Ctrl+Shift+H (yaw mode).
ChordToggle=1
ChordCycleMode=1
ChordYawMode=1
