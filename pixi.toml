[workspace]
name = "spec-ops-the-line-head-tracking"
version = "0.0.0"
description = "Head tracking mod for Spec Ops: The Line using OpenTrack"
license = "MIT"
channels = ["conda-forge"]
platforms = ["win-64"]

[tasks]
update-submodule = "git submodule update --remote cameraunlock-core && powershell -NoProfile -ExecutionPolicy Bypass -File cameraunlock-core/scripts/update-submodule.ps1"
# Sync the cameraunlock-core submodule to its tracked branch.
sync = "git submodule update --remote cameraunlock-core"

# Configure CMake build (x86 / Win32 - Spec Ops: The Line is a 32-bit UE3 game).
# No -G: let CMake auto-detect the installed Visual Studio generator. Pinning
# "Visual Studio 17 2022" broke on CI once the windows runner image moved to
# VS 2026 (VS 17 absent); auto-detect picks whatever VS the machine has.
setup = { cmd = """
    powershell -Command "if (-not (Test-Path 'build')) { cmake -B build -A Win32 } else { Write-Host 'Build directory exists, skipping setup' -ForegroundColor Yellow }"
""" }

# Build debug configuration.
build = { cmd = "cmake --build build --config Debug", depends-on = ["setup"] }

# Build release configuration.
build-release = { cmd = "cmake --build build --config Release", depends-on = ["setup"] }

# Rewrite config/CameraUnlock.ini, the committed copy of the CameraUnlock.ini the mod creates at
# first launch, from the config table after a change to a row, a comment or a default, then
# rewrite the per_game of launcher-manifest.json's config descriptor from it.
render-config = { cmd = "build/tests/Release/config_tests.exe --render-config config/CameraUnlock.ini && node cameraunlock-core/scripts/encode-seed.mjs", depends-on = ["build-release"] }

# Check the newest installer ZIP's launcher manifest, and that the Nexus ZIP carries no config.
# Reads the ZIPs already in release/, so package first.
validate-manifest = { cmd = "node cameraunlock-core/scripts/validate-manifest.mjs" }

# Build + deploy release to the game directory.
install = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/deploy.ps1 Release", depends-on = ["build-release"] }

# Remove the mod from the game directory. /y keeps it prompt-free under pixi (no TTY).
uninstall = "scripts\\uninstall.cmd /y"

# Run the unit tests (UE3 rotation maths, aim projection, the frozen config reader) and the
# config differential test against the published build.
test-unit = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/run-tests.ps1 -Suite unit", depends-on = ["build-release"] }
test-differential = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/run-tests.ps1 -Suite differential", depends-on = ["build-release"] }
test = { depends-on = ["test-unit", "test-differential"] }

# Strip the third-party DLLs the upstream x86 loader embeds as resources
# (binkw32.dll, wndmode.dll, vorbisfile.dll). update-deps runs this already;
# the task exists for a loader copied in by hand.
strip-loader = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/strip-loader-payload.ps1 -Path vendor/ultimate-asi-loader/dinput8.dll" }

# Package release ZIPs (installer + nexus).
package = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/package-release.ps1", depends-on = ["build-release", "test-unit"] }

# Clean build artifacts. No $vars in inline commands - pixi's shell eats them before PowerShell runs.
clean = { cmd = """
    powershell -Command "if (Test-Path build) { Remove-Item build -Recurse -Force }; if (Test-Path bin) { Remove-Item bin -Recurse -Force }; Write-Host 'Build artifacts cleaned' -ForegroundColor Green"
""" }

# Automated release workflow (version bump, changelog, tag, push).
release = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/release.ps1" }

# Bump vendored Ultimate ASI Loader to the latest pinned upstream. Manual; commit the result.
update-deps = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/update-deps.ps1" }

[dependencies]
# CMake and Visual Studio come from the system. Packaging, validate-manifest,
# render-config and the config lint run node.
nodejs = "==26.5.0"
